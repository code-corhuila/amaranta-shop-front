# Serves the shell: static files, the client's routes, and the cache rules of Annex H.

# The portals take `shell/apiClient` from this server, so their pages (another origin) must be allowed to read its files.
# An origin that is not listed gets an empty value, and an empty add_header sends nothing.
map $http_origin $portal_origin {
    default                     "";
    "http://localhost:4201"     $http_origin;    # catalog-portal
    "http://localhost:4202"     $http_origin;    # sales-portal
}

server {
    listen 4200;
    server_tokens off;    # the server does not say which nginx it is
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The probe of an orchestrator: it needs nothing from the application and is not logged.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Annex H, rule 4: remoteEntry.js and the manifest decide which version of each portal a browser loads, so they are
    # NEVER cached. A stale copy sends a browser to a portal that no longer exists.
    location ~ ^/(remoteEntry\.js|mf-manifest\.json)$ {
        include /etc/nginx/snippets/shell-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed by the build: a file never changes under its name, so it is cached for good. One that does not exist is a 404,
    # never the page: a browser holding an old page must not receive HTML where it asked for a script.
    location /assets/ {
        include /etc/nginx/snippets/shell-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The page, and every route of the client (/catalog/products/7f3a is not a file): the page, revalidated every time.
    location = /index.html {
        include /etc/nginx/snippets/shell-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/snippets/shell-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
